# Evaluation set: 45 questions (15 per type). See eval/run_eval.py for how each field is scored.
#   expected_route         route the orchestrator should pick (cypher | rag | hybrid)
#   gold_cypher            reference query; the generated query's result set is compared with its own
#   mention_from_gold      answer must mention values from the gold result (first column)
#   must_mention           keywords the answer must contain (case-insensitive)
#   expected_sources_any   at least one of these document ids must be retrieved in the top 5
#   expected_tools         tools that must have been called
# These questions deliberately differ from the few-shot examples in retrieval/cypher_examples.yaml.

# ---- Text2Cypher ---------------------------------------------------------------------------
- id: c01
  type: cypher
  expected_route: cypher
  question: How many machines does each plant have?
  gold_cypher: |
    MATCH (p:Plant)-[:HAS_LINE]->(:ProductionLine)-[:HAS_MACHINE]->(m:Machine)
    RETURN p.name AS plant, count(m) AS machines
  mention_from_gold: true

- id: c02
  type: cypher
  expected_route: cypher
  question: How many model2 machines are on line B3?
  gold_cypher: |
    MATCH (:ProductionLine {id: 'B3'})-[:HAS_MACHINE]->(m:Machine)-[:IS_MODEL]->(:MachineModel {id: 'model2'})
    RETURN count(m) AS machines
  mention_from_gold: true

- id: c03
  type: cypher
  expected_route: cypher
  question: What is the highest machine age in the factory?
  gold_cypher: |
    MATCH (m:Machine) RETURN max(m.age) AS oldest
  mention_from_gold: true

- id: c04
  type: cypher
  expected_route: cypher
  question: How many failures has M042 had in total?
  gold_cypher: |
    MATCH (f:Failure)-[:OCCURRED_ON]->(:Machine {id: 'M042'}) RETURN count(f) AS failures
  mention_from_gold: true

- id: c05
  type: cypher
  expected_route: cypher
  question: Which component type has failed most often overall?
  gold_cypher: |
    MATCH (f:Failure)-[:FAILED]->(c:Component)
    RETURN c.name AS component, count(f) AS failures ORDER BY failures DESC LIMIT 1
  mention_from_gold: true

- id: c06
  type: cypher
  expected_route: cypher
  question: How many error3 events were recorded in the historical data?
  gold_cypher: |
    MATCH (e:ErrorEvent {source: 'kaggle'})-[:OF_TYPE]->(:ErrorType {id: 'error3'}) RETURN count(e) AS events
  mention_from_gold: true

- id: c07
  type: cypher
  expected_route: cypher
  question: Which technicians work the night shift?
  gold_cypher: |
    MATCH (t:Technician {shift: 'night'}) RETURN t.name AS technician
  mention_from_gold: true

- id: c08
  type: cypher
  expected_route: cypher
  question: Which machines feed directly into M050?
  gold_cypher: |
    MATCH (u:Machine)-[:FEEDS_INTO]->(:Machine {id: 'M050'}) RETURN u.id AS machine
  mention_from_gold: true

- id: c09
  type: cypher
  expected_route: cypher
  question: How many machines are downstream of M010 within two hops?
  gold_cypher: |
    MATCH (:Machine {id: 'M010'})-[:FEEDS_INTO*1..2]->(d:Machine) RETURN count(DISTINCT d) AS machines
  mention_from_gold: true

- id: c10
  type: cypher
  expected_route: cypher
  question: How many replacements were caused by a failure rather than scheduled maintenance?
  gold_cypher: |
    MATCH (e:MaintenanceEvent {reason: 'failure'}) RETURN count(e) AS replacements
  mention_from_gold: true

- id: c11
  type: cypher
  expected_route: cypher
  question: How many failures happened in July 2015?
  gold_cypher: |
    MATCH (f:Failure) WHERE f.ts >= datetime('2015-07-01') AND f.ts < datetime('2015-08-01') RETURN count(f) AS failures
  mention_from_gold: true

- id: c12
  type: cypher
  expected_route: cypher
  question: Which machines on line A1 are model4?
  gold_cypher: |
    MATCH (:ProductionLine {id: 'A1'})-[:HAS_MACHINE]->(m:Machine)-[:IS_MODEL]->(:MachineModel {id: 'model4'})
    RETURN m.id AS machine
  mention_from_gold: true

- id: c13
  type: cypher
  expected_route: cypher
  question: How many production lines does the Leipzig plant have?
  gold_cypher: |
    MATCH (:Plant {id: 'P2'})-[:HAS_LINE]->(l:ProductionLine) RETURN count(l) AS lines
  mention_from_gold: true

- id: c14
  type: cypher
  expected_route: cypher
  question: What is the average age of model1 machines?
  gold_cypher: |
    MATCH (m:Machine)-[:IS_MODEL]->(:MachineModel {id: 'model1'}) RETURN avg(m.age) AS avg_age
  mention_from_gold: true

- id: c15
  type: cypher
  expected_route: cypher
  question: Which technician replaced the most spindle bearings?
  gold_cypher: |
    MATCH (t:Technician)<-[:PERFORMED_BY]-(:MaintenanceEvent)-[:REPLACED]->(c:Component {type: 'comp1'})
    RETURN t.name AS technician, count(*) AS replacements ORDER BY replacements DESC LIMIT 1
  mention_from_gold: true

